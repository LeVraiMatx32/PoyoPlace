<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Poyoya Place</title>
  <link rel="stylesheet" href="style.css">
  <!-- SDK Discord pour les Embedded Apps -->
  <script src="https://cdn.jsdelivr.net/npm/@discord/embedded-app-sdk@1.1.0/dist/index.global.min.js"></script>
</head>
<body>
  <div id="app">
    <header>
      <h1>Poyoya R/Place 🎨</h1>
      <div id="user-info">Chargement du profil Discord...</div>
    </header>

    <main>
      <!-- Zone d'affichage du Canvas -->
      <div class="canvas-container" id="canvasContainer">
        <canvas id="placeCanvas" width="500" height="500"></canvas>
      </div>

      <!-- Barre d'outils -->
      <div class="toolbar">
        <div class="color-picker-group">
          <label for="colorPicker">Couleur :</label>
          <input type="color" id="colorPicker" value="#FF0000">
        </div>

        <div class="info-group">
          <span id="coordsDisplay">X: -, Y: -</span>
        </div>

        <button id="placeBtn">Poser le pixel</button>
        <div id="cooldownTimer">Prêt !</div>
      </div>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
